<div class="form-campo {% if campo.errors %}con-error{% endif %} {{ extra_clase }}">
    <label for="{{ campo.id_for_label }}">
        {{ campo.label }}{% if campo.field.required %}<span class="req">*</span>{% endif %}
    </label>
    {{ campo }}
    {% if campo.help_text %}<small class="ayuda">{{ campo.help_text }}</small>{% endif %}
    {% for error in campo.errors %}<small class="error-texto">{{ error }}</small>{% endfor %}
</div>
